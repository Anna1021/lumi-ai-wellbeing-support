<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumi · Profile</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><style>.profile-page{width:min(900px,calc(100% - (var(--page-side-padding)*2)));margin:34px auto 90px}.profile-card{padding:42px;display:grid;grid-template-columns:160px 1fr;gap:42px}.profile-avatar-wrap{text-align:center}.profile-avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:var(--shadow-soft)}.avatar-edit{margin-top:14px}.profile-card h1{margin:0 0 8px;color:var(--text-primary)}.profile-card p{color:var(--text-secondary)}.profile-fields{display:grid;gap:18px;margin-top:28px}.profile-fields label{display:grid;gap:7px;color:var(--text-primary);font-weight:700}.profile-fields input{height:48px;padding:0 14px;border:1px solid #d9e5f5;border-radius:13px;font:inherit}.profile-actions{display:flex;gap:12px;margin-top:30px}.modal{display:none;position:fixed;inset:0;z-index:50;background:#071b3c77}.modal-content{width:min(420px,calc(100% - 32px));margin:15vh auto;padding:30px;background:#fff;border-radius:22px}.close-button{float:right;font-size:28px;cursor:pointer}@media(max-width:600px){.profile-page{margin-top:24px}.profile-card{grid-template-columns:1fr;padding:28px}.profile-avatar-wrap{text-align:left}.profile-actions{flex-direction:column}}</style></head><body class="sana-shell"><div data-sana-navbar></div><main class="profile-page"><section class="sana-card profile-card"><div class="profile-avatar-wrap"><img src="./image/lego.png" alt="Your avatar" class="profile-avatar avatar-image"><button class="sana-secondary-btn avatar-edit" onclick="openModal()">Change photo</button></div><div><h1 id="profileName">Your profile</h1><p>Keep your details up to date so Lumi feels personal.</p><div class="profile-fields"><label>Email<input type="email" id="emailInput" value="S-YANG-100@sms.ed.ac.uk"></label><label>Phone number<input id="phoneInput" value="+93123135"></label><label>Country<input id="countryInput" value="United Kingdom"></label></div><div class="profile-actions"><button class="sana-primary-btn" onclick="updateProfile()">Save changes</button><button class="sana-secondary-btn" onclick="logout()">Log out</button></div></div></section></main><div id="uploadModal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeModal()">×</span><h2>Upload a new avatar</h2><form id="avatarUploadForm"><input type="file" id="avatarInput" accept="image/*" required><button class="sana-primary-btn" type="submit">Upload</button></form></div></div><script src="components/navbar.js"></script><script src="auth.js?v=5"></script><script>function openModal(){uploadModal.style.display='block'}function closeModal(){uploadModal.style.display='none'}avatarUploadForm.addEventListener('submit',e=>{e.preventDefault();const f=avatarInput.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{document.querySelector('.avatar-image').src=e.target.result;closeModal()};r.readAsDataURL(f)});function updateProfile(){alert('Profile updated.')}function logout(){if(window.SanaAuth)SanaAuth.logout();location.href='login.html'}const u=window.SanaAuth&&SanaAuth.currentUser();if(u)profileName.textContent=u.nickname+'’s profile';</script></body></html>
