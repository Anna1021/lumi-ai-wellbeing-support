<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SANA – Evaluation Result</title>

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  padding: 0;
  font-family: "Fira Code", monospace;
  background: linear-gradient(135deg, #d7c8f5, #f4c7c3);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  color: #1f2a50;
}

/* ===== CONTAINER ===== */
.result-container {
  width: 70%;
  max-width: 920px;
  margin-top: 60px;
  padding: 60px 70px;
  border-radius: 34px;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(30px);
  box-shadow: 0 20px 40px rgba(20, 40, 80, 0.2);
}

/* ===== TITLE ===== */
.result-title {
  font-size: 32px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 40px;
}

/* ===== RADAR CHART ===== */
#radarChart {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 60px auto;
}

/* ===== INSIGHTS ===== */
.insights-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 22px;
}

/* 单条结果 */
.result-row {
  width: 100%;
  margin-bottom: 26px;
}

.result-label {
  font-size: 16px;
  margin-bottom: 6px;
}

/* 渐变进度条 */
.progress-bar-track {
  width: 100%;
  height: 16px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 16px;
  border-radius: 999px;
  background: linear-gradient(90deg, #4e9cff, #8c68ff);
  transition: width 0.4s ease;
}

/* 等级文本 */
.result-score {
  text-align: right;
  margin-top: 4px;
  font-size: 15px;
}

/* BACK BUTTON */
.back-btn {
  display: block;
  width: 260px;
  margin: 50px auto 0 auto;
  padding: 15px 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #2f8cff, #3779ff);
  color: #fff;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 16px 40px rgba(18, 84, 196, 0.38);
  transition: 0.25s;
}

.back-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 50px rgba(18, 84, 196, 0.55);
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="result-container">

  <h2 class="result-title">Your Evaluation Result</h2>

  <!-- Radar Chart -->
  <canvas id="radarChart"></canvas>

  <!-- Insights -->
  <h3 class="insights-title">Insights</h3>
  <div id="insights"></div>

  <a href="SANA.html" class="back-btn">Back to Home</a>
</div>


<script>
/* ========= Load Answers ========= */
let answers = JSON.parse(localStorage.getItem("evalAnswers") || "[]");

// 防止空数据
if (!answers.length) {
  answers = [3, 4, 4, 3, 4]; // 默认示例
}

/* ========= Radar Chart ========= */
const labels = [
  "Mood",
  "Social Support",
  "Openness",
  "Organization",
  "Emotional Stability"
];

new Chart(document.getElementById("radarChart"), {
  type: "radar",
  data: {
    labels: labels,
    datasets: [
      {
        label: "Your Score",
        data: answers.map(v => v + 1),
        backgroundColor: "rgba(80,130,255,0.25)",
        borderColor: "#4e9cff",
        pointBackgroundColor: "#ffffff",
        pointBorderColor: "#4e9cff",
        pointRadius: 4,
        borderWidth: 2
      }
    ]
  },
  options: {
    scales: {
      r: {
        min: 0,
        max: 6,
        ticks: { display: false },
        grid: { color: "rgba(80,80,80,0.15)" },
        angleLines: { color: "rgba(100,100,100,0.2)" }
      }
    },
    plugins: { legend: { display: false } }
  }
});

/* ========= Insights Generator ========= */
function scoreToText(score) {
  if (score >= 4) return "excellent ✨";
  if (score >= 3) return "good 😊";
  if (score >= 2) return "average 🙂";
  return "low 😟";
}

const insightsContainer = document.getElementById("insights");

labels.forEach((label, idx) => {
  const score = answers[idx];
  const percent = ((score + 1) / 6) * 100;

  insightsContainer.innerHTML += `
    <div class="result-row">
      <div class="result-label">${label}</div>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${percent}%"></div>
      </div>

      <div class="result-score">${scoreToText(score)}</div>
    </div>
  `;
});
</script>

</body>
</html>
